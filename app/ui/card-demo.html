<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾字 · 词条库（极简卡片式）</title>
<link rel="stylesheet" href="card-demo.css">
</head>
<body>
  <div class="page">
    <div class="head">
      <div>
        <p class="eyebrow">词条库</p>
        <h1>最近入库</h1>
        <p class="muted">共 <b id="total">0</b> 条，来自 3 个词库包</p>
      </div>
      <button class="fab" id="shuffle" title="换一批" aria-label="换一批">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px">
          <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
          <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
        </svg>
      </button>
    </div>
    <div class="list" id="list"></div>
  </div>
  <script src="entries.js"></script>
  <script src="search-core.js"></script>
  <script src="card-demo.js"></script>
</body>
</html>
